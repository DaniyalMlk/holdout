name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest

  wheel:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      # The same reading of the metadata the index performs on upload. Failing
      # it here is failing it in the only place a failure is still cheap: an
      # index will not accept a replacement for a version already taken.
      - name: Check the metadata the index will read
        run: python -m twine check --strict dist/*
      - name: Install into a clean environment and run every command
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import holdout; print(holdout.__version__)"
          /tmp/clean/bin/holdout --version
          /tmp/clean/bin/holdout sample-data --out /tmp/sample
          /tmp/clean/bin/holdout sharpe /tmp/sample/sweep.csv --column ma10_120
          /tmp/clean/bin/holdout deflate /tmp/sample/trending.csv
          /tmp/clean/bin/holdout pbo /tmp/sample/sweep.csv
          /tmp/clean/bin/holdout spa /tmp/sample/trending.csv --bootstrap 500
      # These assertions read License-Expression, License-File and the
      # classifiers out of dist-info. In the test job that dist-info belongs to
      # an editable install, written once and able to agree with a
      # pyproject.toml that has since changed. Here it is the artefact that
      # would actually be published.
      - name: The metadata tests run against the installed wheel
        run: |
          /tmp/clean/bin/pip install pytest
          /tmp/clean/bin/python -m pytest tests/test_metadata.py -q
      # The sdist is built by a different code path from the wheel, and a file
      # left out of one can be present in the other: py.typed and LICENSE both
      # arrive by mechanisms that apply to only one of the two. The sdist is
      # also what an index serves to anyone whose platform has no matching
      # wheel.
      - name: Install the sdist into a clean environment and run it
        run: |
          python -m venv /tmp/from-sdist
          /tmp/from-sdist/bin/pip install dist/*.tar.gz
          /tmp/from-sdist/bin/holdout --version
          /tmp/from-sdist/bin/holdout sample-data --out /tmp/sdist-sample
          cd /tmp
          /tmp/from-sdist/bin/holdout pbo /tmp/sdist-sample/sweep.csv > /dev/null
          /tmp/from-sdist/bin/python -c "
          import holdout, pathlib
          assert (pathlib.Path(holdout.__file__).parent / 'py.typed').is_file()
          print('py.typed present in the sdist install')
          "
