[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holdout"
version = "0.1.0"
description = "A backtest overfitting toolkit: deflated Sharpe ratios, backtest overfitting probability, purged cross-validation and multiple-testing haircuts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniyal" }]
keywords = [
    "backtesting",
    "sharpe-ratio",
    "deflated-sharpe-ratio",
    "backtest-overfitting",
    "multiple-testing",
    "cross-validation",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.80",
    "mypy>=1.8",
    "ruff>=0.16,<0.17",
    "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/DaniyalMlk/holdout"
Issues = "https://github.com/DaniyalMlk/holdout/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/holdout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
files = ["src/holdout", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PIE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
